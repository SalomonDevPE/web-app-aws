<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CloudBox</title>

    <script>

        (() => {

            const token =
                localStorage.getItem("cb_access") ||
                sessionStorage.getItem("cb_access");

            const exp = parseInt(
                localStorage.getItem("cb_exp") ||
                sessionStorage.getItem("cb_exp") ||
                "0",
                10
            );


            /*
             * Si existe un token y todavía
             * no ha expirado → Dashboard
             */

            if (
                token &&
                Date.now() < exp
            ) {

                window.location.replace(
                    "dashboard.html"
                );

                return;

            }


            /*
             * Si no existe sesión válida
             * → Login
             */

            window.location.replace(
                "login.html"
            );

        })();

    </script>

</head>


<body>

    <noscript>

        <p>
            Necesitas activar JavaScript
            para utilizar CloudBox.
        </p>

    </noscript>

</body>

</html>
